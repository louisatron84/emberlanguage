[project]
name = "ember"
version = "0.1.0"
description = "Ember: a fast, Python-feeling language that compiles to C"
requires-python = ">=3.11"

[project.scripts]
ember = "ember.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ember"]

[tool.setuptools.package-data]
ember = ["ember_runtime.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
